name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme NetworkWatcher \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath TestResults \
            -enableCodeCoverage YES \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 60 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO | xcpretty --color && exit ${PIPESTATUS[0]}
        timeout-minutes: 10

      - name: Convert coverage to Sonar format
        run: |
          brew install a7ex/homebrew-formulae/xcresultparser
          xcresultparser --output-format sonarqube-generic-coverage TestResults.xcresult > sonar-coverage.xml


      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
